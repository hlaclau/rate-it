[tools]
go = "1.25"
bun = "latest"

[tasks."db-up"]
description = "Start PostgreSQL and Redis"
run = "docker compose -f docker-compose.dev.yml up -d"

[tasks."db-down"]
description = "Stop PostgreSQL and Redis"
run = "docker compose -f docker-compose.dev.yml down"

[tasks."db-reset"]
description = "Wipe and restart databases (destroys data)"
run = """
docker compose -f docker-compose.dev.yml down -v
docker compose -f docker-compose.dev.yml up -d
"""

[tasks."dev"]
description = "Start everything (api + frontend + databases)"
depends = ["dev-api", "dev-ui"]

[tasks."dev-api"]
description = "Start the Go API (port 8080)"
depends = ["db-up"]
dir = "backend"
run = "go run ./cmd/..."

[tasks."dev-ui"]
description = "Start the Nuxt frontend (port 3000)"
depends = ["db-up"]
dir = "frontend"
run = "bun run dev"

[tasks."format"]
description = "Format frontend and backend"
run = """
(cd frontend && bun run format)
(cd backend && go fmt ./...)
"""

[tasks."lint"]
description = "Lint frontend and backend"
run = """
(cd frontend && bun run lint)
(cd backend && go vet ./...)
"""

[tasks.test]
description = "Run tests with enhanced visual rendering"
dir = "backend"
run = "gotestsum --format dots ./..."

[tasks."test-handlers"]
description = "Run handler tests only"
dir = "backend"
run = "go test ./internal/handler/... -v"

[tasks."test-ci"]
description = "Run all tests without cache (for CI)"
dir = "backend"
run = "go test ./... -v -count=1"

[tasks."install"]
description = "Install all dependencies (requires mise)"
run = """
(cd frontend && bun install)
(cd backend && go mod download)
"""

[tasks."stop"]
description = "Stop api, frontend and databases"
run = """
lsof -ti:8080 | xargs kill -9 2>/dev/null || true
lsof -ti:3000 | xargs kill -9 2>/dev/null || true
docker compose -f docker-compose.dev.yml down
"""
